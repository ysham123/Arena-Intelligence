[project]
name = "arena-intelligence"
version = "0.2.0"
description = "Evidence-grounded agents for a deterministic native strategy arena"
requires-python = ">=3.11"
dependencies = ["anthropic==0.78.0", "pydantic>=2.11"]

[project.scripts]
arena = "arena_intelligence.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
